<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Real-Time Shape Morphing | WebGL Font Engine</title>
    <meta name="description" content="A blazing fast WebGL 2.0 demonstration of rendering and morphing vector shapes purely with mathematics in the fragment shader, inspired by Slug.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;">
    <!-- Modern Font for the UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #f4f4f5;
        }

        #webgl-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            will-change: transform;
        }

        /* Modern Glassmorphic UI Panel */
        .controls-panel {
            position: absolute;
            top: 32px;
            right: 32px;
            width: 320px;
            background: rgba(24, 24, 27, 0.4);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .controls-panel h1 {
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-panel p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .value-display {
            color: #a855f7;
            font-weight: 600;
        }

        /* Custom Modern Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #fff;
            margin-top: -8px;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.6);
            border: 2px solid #6366f1;
            transition: transform 0.1s ease;
            will-change: transform;
        }
        
        input[type=range]::-webkit-slider-thumb:hover, input[type=range]:focus::-webkit-slider-thumb {
            transform: scale(1.15);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: background 0.3s ease;
        }
        
        input[type=range]:focus::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Toggle Switch */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: #fff;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            will-change: transform;
        }

        input:checked + .slider {
            background-color: #6366f1;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #6366f1;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <main>
        <canvas id="webgl-canvas" aria-label="Interactive morphing vector canvas"></canvas>

        <section class="controls-panel" aria-labelledby="panel-heading">
            <h1 id="panel-heading">GPU Font Engine</h1>
            <p>Real-time vector morphing implemented purely in a WebGL fragment shader. (No textures/SDFs)</p>

            <form onsubmit="return false;">
                <div class="control-group">
                    <label for="weight">
                        <span>Weight</span>
                        <span class="value-display" id="weight-val">0.00</span>
                    </label>
                    <input type="range" id="weight" name="weight" min="-0.15" max="0.30" step="0.01" value="0.0" title="Adjust the geometric weight offset">
                </div>

                <div class="control-group">
                    <label for="slant">
                        <span>Slant (Italic)</span>
                        <span class="value-display" id="slant-val">0.00</span>
                    </label>
                    <input type="range" id="slant" name="slant" min="-0.6" max="0.6" step="0.05" value="0.0" title="Adjust the italic shear slant">
                </div>

                <div class="control-group">
                    <label for="tension">
                        <span>Tension (Morph)</span>
                        <span class="value-display" id="tension-val">0.00</span>
                    </label>
                    <input type="range" id="tension" name="tension" min="0.0" max="1.0" step="0.01" value="0.0" title="Apply abstract vertex tension to morph the base shape">
                </div>

                <div class="toggle-wrapper">
                    <label for="breathing" class="toggle-label">Continuous Breathing</label>
                    <label class="switch">
                        <input type="checkbox" id="breathing" name="breathing" title="Toggle automatic subtle pulsing animation">
                        <span class="slider" aria-hidden="true"></span>
                    </label>
                </div>
            </form>
        </section>
    </main>

    <!-- The main application script -->
    <script src="main.js"></script>
</body>
</html>
