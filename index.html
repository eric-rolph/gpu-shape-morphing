<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Real-Time Shape Morphing</title>
    <!-- Modern Font for the UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            color: #f4f4f5;
        }

        #webgl-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Modern Glassmorphic UI Panel */
        .controls-panel {
            position: absolute;
            top: 32px;
            right: 32px;
            width: 320px;
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .controls-panel h1 {
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-panel p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .value-display {
            color: #a855f7;
            font-weight: 600;
        }

        /* Custom Modern Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.6);
            border: 2px solid #6366f1;
            transition: transform 0.1s ease;
        }
        
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Toggle Switch */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: #fff;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        input:checked + .slider {
            background-color: #6366f1;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="controls-panel">
        <h1>GPU Font Engine</h1>
        <p>Real-time vector morphing implemented purely in a WebGL fragment shader.</p>

        <div class="control-group">
            <label>
                <span>Weight</span>
                <span class="value-display" id="weight-val">0.0</span>
            </label>
            <input type="range" id="weight" min="-0.15" max="0.30" step="0.01" value="0.0">
        </div>

        <div class="control-group">
            <label>
                <span>Slant (Italic)</span>
                <span class="value-display" id="slant-val">0.0</span>
            </label>
            <input type="range" id="slant" min="-0.6" max="0.6" step="0.05" value="0.0">
        </div>

        <div class="control-group">
            <label>
                <span>Tension (Morph)</span>
                <span class="value-display" id="tension-val">0.0</span>
            </label>
            <input type="range" id="tension" min="0.0" max="1.0" step="0.01" value="0.0">
        </div>

        <div class="toggle-wrapper">
            <span class="toggle-label">Continuous Breathing</span>
            <label class="switch">
                <input type="checkbox" id="breathing">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- The main application script -->
    <script src="main.js"></script>
</body>
</html>
