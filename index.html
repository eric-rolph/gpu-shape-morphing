<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Real-Time Shape Morphing | WebGL Font Engine</title>
    <meta name="description" content="A blazing fast WebGL 2.0 demonstration of rendering and morphing vector shapes purely with mathematics in the fragment shader, inspired by Slug.">
    
    <!-- Open Graph & Twitter Social Metrics -->
    <meta property="og:title" content="GPU Real-Time Shape Morphing">
    <meta property="og:description" content="A zero-dependency WebGL fragment shader analytical font rendering engine.">
    <meta property="og:image" content="https://raw.githubusercontent.com/eric-rolph/gpu-shape-morphing/master/demo.png">
    <meta property="og:url" content="https://github.com/eric-rolph/gpu-shape-morphing">
    <meta name="twitter:card" content="summary_large_image">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net;">
    <!-- Modern Font for the UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- OpenType.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>
    <style>
        :root {
            --bg-color: #09090b;
            --text-main: #f4f4f5;
            --text-muted: rgba(255, 255, 255, 0.5);
            --primary: #6366f1;
            --secondary: #a855f7;
            --panel-bg: rgba(24, 24, 27, 0.4);
            --panel-border: rgba(255, 255, 255, 0.08);
            --track-bg: rgba(255, 255, 255, 0.1);
            --track-bg-focus: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #webgl-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            will-change: transform;
        }

        /* Modern Glassmorphic UI Panel */
        .controls-panel {
            position: absolute;
            top: 32px;
            right: 32px;
            width: 320px;
            background: var(--panel-bg);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .controls-panel h1 {
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-panel p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .value-display {
            color: #a855f7;
            font-weight: 600;
        }

        /* Custom Modern Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #fff;
            margin-top: -8px;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.6);
            border: 2px solid #6366f1;
            transition: transform 0.1s ease;
            will-change: transform;
        }
        
        input[type=range]::-webkit-slider-thumb:hover, input[type=range]:focus::-webkit-slider-thumb {
            transform: scale(1.15);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: background 0.3s ease;
        }
        
        input[type=range]:focus::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Toggle Switch */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: #fff;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            will-change: transform;
        }

        input:checked + .slider {
            background-color: #6366f1;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #6366f1;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .select-modern {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--panel-border);
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        .select-modern option {
            background: #18181b;
            color: #fff;
        }

        .input-modern {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--panel-border);
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }
        .input-modern:focus {
            border-color: #6366f1;
        }

        /* Drag and Drop Zone */
        .drop-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(99, 102, 241, 0.2);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border: 4px dashed #6366f1;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .drop-overlay.active {
            display: flex;
        }
        .drop-overlay h2 {
            font-size: 32px;
            font-weight: 600;
            color: white;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        .btn-modern {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        .btn-modern:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <main>
        <canvas id="webgl-canvas" aria-label="Interactive morphing vector canvas"></canvas>
        <canvas id="overlay-canvas" style="position: absolute; top: 0; left: 0; pointer-events: none; width: 100vw; height: 100vh;"></canvas>

        <section class="controls-panel" aria-labelledby="panel-heading">
            <h1 id="panel-heading">GPU Font Engine</h1>
            <p style="margin-bottom: 16px;">Real-time vector morphing implemented purely in a WebGL fragment shader. Drop a <b>.glif</b> or <b>.ttf/.otf</b> file here to parse XML vectors instantly. Scroll to Zoom, Drag to Pan!</p>

            <form onsubmit="return false;">
                <div class="control-group" id="live-text-container" style="display: none;">
                    <label for="live-text">
                        <span>Preview Text</span>
                    </label>
                    <input type="text" id="live-text" class="input-modern" value="A" maxlength="3" title="Type characters to morph live!">
                </div>

                <div class="control-group">
                    <label for="weight-x">
                        <span>Stem Weight (X)</span>
                        <span class="value-display" id="weight-x-val">0.00</span>
                    </label>
                    <input type="range" id="weight-x" name="weight-x" min="-0.20" max="0.40" step="0.01" value="0.0" title="Independent horizontal stroke contrast extrusion">
                </div>

                <div class="control-group">
                    <label for="weight-y">
                        <span>Crossbar Weight (Y)</span>
                        <span class="value-display" id="weight-y-val">0.00</span>
                    </label>
                    <input type="range" id="weight-y" name="weight-y" min="-0.20" max="0.40" step="0.01" value="0.0" title="Independent vertical stroke contrast extrusion">
                </div>

                <div class="control-group">
                    <label for="slant">
                        <span>Slant (Italic)</span>
                        <span class="value-display" id="slant-val">0.00</span>
                    </label>
                    <input type="range" id="slant" name="slant" min="-0.6" max="0.6" step="0.05" value="0.0" title="Adjust the italic shear slant">
                </div>

                <div class="control-group">
                    <label for="render-mode">
                        <span>Optical Engine Mode</span>
                    </label>
                    <select id="render-mode" class="select-modern" name="render-mode" title="Simulate low-DPI screen bleeding or ClearType AA">
                        <option value="0">Vector Perfect (Analytic)</option>
                        <option value="1">Newsprint (Ink Bleed Physics)</option>
                        <option value="2">ClearType (Subpixel RGB AA)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="tension">
                        <span>Tension (Morph)</span>
                        <span class="value-display" id="tension-val">0.00</span>
                    </label>
                    <input type="range" id="tension" name="tension" min="0.0" max="1.0" step="0.01" value="0.0" title="Apply abstract vertex tension to morph the base shape">
                </div>

                <div class="toggle-wrapper" style="margin-top: 20px; padding-top: 16px;">
                    <label for="show-flaws" class="toggle-label">Inspect Vector Flaws (Kinks)</label>
                    <label class="switch">
                        <input type="checkbox" id="show-flaws" name="show-flaws" title="Highlights mathematical tangents causing inflection overlap">
                        <span class="slider" aria-hidden="true"></span>
                    </label>
                </div>

                <div class="toggle-wrapper" style="margin-top: 16px; padding-top: 16px;">
                    <label for="show-skeleton" class="toggle-label">Inspect Vector Skeleton</label>
                    <label class="switch">
                        <input type="checkbox" id="show-skeleton" name="show-skeleton" title="Overlay the exact mathematical anchor constraints via Context2D">
                        <span class="slider" aria-hidden="true"></span>
                    </label>
                </div>

                <div class="toggle-wrapper" style="margin-top: 16px; padding-top: 16px;">
                    <label for="breathing" class="toggle-label">Continuous Breathing</label>
                    <label class="switch">
                        <input type="checkbox" id="breathing" name="breathing" title="Toggle automatic subtle pulsing animation">
                        <span class="slider" aria-hidden="true"></span>
                    </label>
                </div>

                <button type="button" id="btn-export" class="btn-modern">Export Morph as .glif UFO</button>
            </form>
        </section>
        
        <div id="drop-zone" class="drop-overlay">
            <h2>Drop Font File (.glif, .ttf, .otf) Here</h2>
        </div>
    </main>

    <!-- The main application script -->
    <script src="main.js"></script>
</body>
</html>
